          <br>request:</p>
        <p style="margin-left:40px;">QoS level 0 (fire and forget): provides no delivery guarantees and has
          <br>the smallest overhead.
          <br>QoS level 1: provides at least one delivery guarantee.
          <br>QoS level 2: provides exactly one delivery guarantee.</p>
